
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="weather-app">
    <h1>Weather App</h1>

    <section id="weather-display">
      <h2 id="location">Select a city</h2>

      <div class="weather-main">
        <p id="main-temperature">-- °C</p>

        <div class="weather-condition">
          <img id="weather-icon" alt="Weather icon" hidden>
          <p id="weather-main">--</p>
        </div>
      </div>

      <div class="weather-details">
        <p>Feels Like: <span id="feels-like">--</span></p>
        <p>Humidity: <span id="humidity">--</span></p>
        <p>Wind: <span id="wind">--</span></p>
        <p>Gusts: <span id="wind-gust">--</span></p>
      </div>
    </section>

    <div class="weather-controls">
      <label for="city-select">Select a city:</label>

      <select id="city-select">
        <option value=""></option>
        <option value="paris">Paris</option>
        <option value="london">London</option>
        <option value="tokyo">Tokyo</option>
        <option value="los angeles">Los Angeles</option>
        <option value="chicago">Chicago</option>
        <option value="new york">New York</option>
      </select>

      <button id="get-weather-btn">Get Weather</button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
